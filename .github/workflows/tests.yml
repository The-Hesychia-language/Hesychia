name: tests
on:
  push:
jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust's GNU toolchain (Windows)
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      - name: OpenSSL (Windows)
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
          [ -e /c/msys64/mingw64/bin/cc.exe ] || cp /c/msys64/mingw64/bin/gcc.exe /c/msys64/mingw64/bin/cc.exe
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
      - name: Link
        shell: bash
        run: |
          ld --version | head -1
          cargo build --release
          ./target/release/hsy build tests/run/std_net_tls.hsy -o tls.exe --emit-c || true
          set +e
          for v in "-static" "" "-static -Wl,--no-gc-sections" "-static -fuse-ld=lld"; do
            echo "=== variant [$v]"
            cc -std=c11 -o v.exe tls.c -O0 -g $v -pthread -lssl -lcrypto -lcrypt32 -lws2_32 -lm
            echo "status $?"
            ./v.exe; echo "run $?"
            rm -f v.exe
          done
          echo "=== -O0 -static release-like"
          cc -std=c11 -o r.exe tls.c -Os -ffunction-sections -fdata-sections -static -Wl,--gc-sections -s -pthread -lssl -lcrypto -lcrypt32 -lws2_32 -lm; echo "status $?"; ./r.exe; echo "run $?"
          echo "=== no tls"
          ./target/release/hsy build tests/run/std_net.hsy -o n.exe; echo "status $?"
