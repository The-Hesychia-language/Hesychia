# The test suite on the three systems Hesychia promises to run on.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Hesychia emits C for MinGW on Windows: the compiler is built with Rust's GNU toolchain.
      - name: Rust's GNU toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      # `hsy` and the tests call the C compiler `cc`: on Windows, MinGW's gcc under that name,
      # beside it, where gcc finds its own parts.
      - name: cc (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          GCC="$(command -v gcc)"
          cp "$GCC" "$(dirname "$GCC")/cc.exe"
          cc --version

      - name: Tests
        shell: bash
        run: cargo test --release
