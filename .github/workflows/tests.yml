name: tests
on:
  push:
jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust's GNU toolchain (Windows)
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      - name: OpenSSL (Windows)
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
          [ -e /c/msys64/mingw64/bin/cc.exe ] || cp /c/msys64/mingw64/bin/gcc.exe /c/msys64/mingw64/bin/cc.exe
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
      - name: Link
        shell: bash
        run: |
          which cc gcc ld; cc --version | head -1
          cargo build --release
          ./target/release/hsy build tests/run/std_net_tls.hsy -o tls.exe --emit-c && ./tls.exe || echo "TLS FAILED $?"
          ./target/release/hsy build tests/run/std_http.hsy -o http.exe --emit-c || true
          cc -std=c11 -o http2.exe http.c -Os -static -pthread -lssl -lcrypto -lcrypt32 -lws2_32 -lm -Wl,--verbose 2>&1 | tail -40 || true
          echo "exit: $?"
          ls -la *.exe || true
